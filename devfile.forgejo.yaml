schemaVersion: 2.3.0
metadata:
  name: weebo-che-forgejo
  description: Workspace for the Forgejo gitServices RFC (che-server, che-operator, che-dashboard, che-docs)
  # Start with: https://<che-host>/#https://github.com/batleforc/weebo-che-project?df=devfile.forgejo.yaml
parent:
  uri: https://raw.githubusercontent.com/batleforc/WeeboDevImage/refs/heads/main/che-min-mise/devfile.yaml
  components:
    - name: tools
      container:
        # che-server full Maven build is memory hungry
        memoryLimit: 12Gi
        memoryRequest: 2Gi
        cpuLimit: "6"
        cpuRequest: "1"
        env:
          - name: FORGEJO_URL
            value: "http://127.0.0.1:3000"
          - name: FORGEJO_DEV_USER
            value: che-dev
          # Throwaway sidecar instance, never reused outside this workspace
          - name: FORGEJO_DEV_PASSWORD
            value: che-dev-password
          - name: MAVEN_OPTS
            value: "-Xmx4g"
          - name: GOMODCACHE
            value: /home/user/.cache/go-mod
        endpoints:
          - name: dashboard-dev
            exposure: public
            protocol: https
            targetPort: 8080
            path: /

components:
  - name: forgejo
    container:
      image: codeberg.org/forgejo/forgejo:13-rootless # align with the weebo-si Forgejo version
      memoryLimit: 1Gi
      memoryRequest: 256Mi
      mountSources: false
      env:
        - name: FORGEJO__security__INSTALL_LOCK
          value: "true"
        - name: FORGEJO__database__DB_TYPE
          value: sqlite3
        - name: FORGEJO__server__HTTP_PORT
          value: "3000"
        - name: FORGEJO__server__START_SSH_SERVER
          value: "true"
        - name: FORGEJO__server__SSH_LISTEN_PORT
          value: "2222"
        - name: FORGEJO__service__DISABLE_REGISTRATION
          value: "true"
        - name: FORGEJO__oauth2__ENABLED
          value: "true"
      volumeMounts:
        - name: forgejo-data
          path: /var/lib/gitea
      endpoints:
        - name: forgejo
          exposure: public
          protocol: https
          targetPort: 3000
          path: /
        - name: forgejo-ssh
          exposure: internal
          protocol: tcp
          targetPort: 2222

  - name: forgejo-data
    volume:
      size: 2Gi

projects:
  - name: main
    git:
      remotes:
        origin: https://github.com/batleforc/weebo-che-project.git
  - name: che-server
    git:
      remotes:
        origin: https://github.com/weebo-si/che-server.git
      checkoutFrom:
        revision: feat/forgejo-gitservice
  - name: che-operator
    git:
      remotes:
        origin: https://github.com/weebo-si/che-operator.git
      checkoutFrom:
        revision: feat/forgejo-gitservice
  - name: dashboard
    git:
      remotes:
        origin: https://github.com/weebo-si/che-dashboard.git
      checkoutFrom:
        revision: feat/forgejo-gitservice
  - name: che-docs
    git:
      remotes:
        origin: https://github.com/weebo-si/che-docs.git
      checkoutFrom:
        revision: feat/forgejo-gitservice

commands:
  - id: init
    exec:
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: task forgejo:init
      group:
        kind: build
  - id: forgejo-admin
    exec:
      label: "Forgejo: create dev admin user"
      component: forgejo
      commandLine: >-
        forgejo admin user create --admin
        --username che-dev --password che-dev-password
        --email che-dev@weebo.poc --must-change-password=false
        || echo "user already exists"
  - id: forgejo-seed
    exec:
      label: "Forgejo: seed repo, PAT and OAuth app"
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: task forgejo:seed
  - id: server-build
    exec:
      label: "che-server: build (skip tests)"
      component: tools
      workingDir: ${PROJECTS_ROOT}/main
      commandLine: task forgejo:server:build
      group:
        kind: build
  - id: server-test
    exec:
      label: "che-server: test Forgejo modules"
      component: tools
      workingDir: ${PROJECTS_ROOT}/main
      commandLine: task forgejo:server:test
      group:
        kind: test
  - id: operator-test
    exec:
      label: "che-operator: generate + test"
      component: tools
      workingDir: ${PROJECTS_ROOT}/main
      commandLine: task forgejo:operator:test
      group:
        kind: test
  - id: dashboard-test
    exec:
      label: "che-dashboard: unit tests"
      component: tools
      workingDir: ${PROJECTS_ROOT}/main
      commandLine: task forgejo:dashboard:test
      group:
        kind: test
  - id: dashboard-cheinche
    exec:
      label: "che-dashboard: che-in-che"
      component: tools
      workingDir: ${PROJECTS_ROOT}/main
      commandLine: task dash:cheinche
      group:
        kind: run
