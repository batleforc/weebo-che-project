schemaVersion: 2.3.0
metadata:
  name: weebo-che-project
parent:
  uri: https://raw.githubusercontent.com/batleforc/WeeboDevImage/refs/heads/main/che-min-mise/devfile.yaml
  components:
    - name: tools
      container:
        endpoints:
          - exposure: public
            name: local-server
            protocol: https
            targetPort: 8080
            path: /
          - exposure: public
            name: bundle-analyzer
            path: /
            protocol: https
            targetPort: 8888

projects:
  - name: main
    git:
      remotes:
        origin: https://github.com/batleforc/weebo-che-project.git
  - name: dashboard
    git:
      remotes:
        origin: https://github.com/batleforc/che-dashboard.git
  - name: jb-plugin
    clonePath: jb/plugin
    git:
      remotes:
        origin: https://github.com/batleforc/eclipse-che-gateway-plugin.git
  - name: jb-ide
    clonePath: jb/ide-dev-server
    git:
      remotes:
        origin: https://github.com/che-incubator/jetbrains-ide-dev-server.git
  - name: che-code
    git:
      remotes:
        origin: https://github.com/batleforc/che-code.git

