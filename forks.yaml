# Controls `task forks:update` (scripts/fork-sync.sh).
#
# Each fork is cloned in a cache dir (FORK_SYNC_DIR, default ~/.cache/weebo-fork-sync), never in
# the /projects working copies. Nothing is pushed unless PUSH=true.
#
# Remotes available in every fork: `origin` (the fork) and `upstream` (the upstream repo).
# Extra remotes are declared per fork under `remotes`.
#
# A branch reference is either:
#   - a string: a branch of the fork (origin), e.g. `feat/forgejo-gitservice`
#   - an object: `{ branch: <branch>, remote: <name>, rfc: <dir> }`. `remote` (default: origin) for a
#     branch outside the fork, `rfc` for the plan or spec in `.rfc/<dir>` that the branch implements
#     (shown by `task forks:plan`)
#
# Steps, in order, for each enabled fork:
#   1. sync:    fast-forward the fork branches to the same upstream branches (never forced)
#   2. fetch:   copy outside branches into the fork (`to`, default: same name); fast-forward only
#               unless `force: true`
#   3. develop: rebuild the develop branch from `base` (after sync), then merge each `merge`
#               entry, in order (`--no-ff`, no rebase). develop is force-pushed when its content
#               changes, left as is otherwise: never commit on develop directly. A conflict aborts
#               the merge and the fork is not pushed.
#
# License: an outside branch ends up in our public fork and in the images built from `develop`.
# Only merge code from EPL-2.0 Che repos (upstream or forks of them). Check anything else first.

defaults:
  org: weebo-si
  upstreamOrg: eclipse-che
  sync: [main]
  develop:
    enabled: true
    branch: develop
    base: main

forks:
  che-server:
    develop:
      merge:
        - { branch: feat/forgejo-gitservice, rfc: forgejo-01 }

  che-operator:
    develop:
      merge:
        - { branch: feat/forgejo-gitservice, rfc: forgejo-01 }

  che-dashboard:
    develop:
      merge:
        - { branch: feat/forgejo-gitservice, rfc: forgejo-01 }
        - { branch: feat/workspace-storage, rfc: pvc-01 }

  che-code:
    upstreamOrg: che-incubator
    # develop follows the latest stable release branch. The merge entries are based on the common
    # ancestor of main and that branch, so they merge in both (develop here, upstream PRs on main).
    sync: [main, 7.123.x]
    develop:
      base: 7.123.x
      merge:
        - { branch: feat/init-copy-cache, rfc: che-code-01 }
        - { branch: feat/container-fonts, rfc: che-code-02 }

  che-docs:
    develop:
      enabled: false
