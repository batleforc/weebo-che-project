# Example only: fill the values from Vault (ExternalSecret) and never commit them.
---
# OIDC client secret of the `che-cluster` application, referenced by spec.networking.auth.oAuthSecret
apiVersion: v1
kind: Secret
metadata:
  name: che-oidc-client
  namespace: eclipse-che
  labels:
    app.kubernetes.io/part-of: che.eclipse.org
type: Opaque
stringData:
  oAuthSecret: <oidc-client-secret>
---
# Forgejo OAuth2 application, redirect URI: https://cde.batleforc.fr/api/oauth/callback
apiVersion: v1
kind: Secret
metadata:
  name: forgejo-oauth-config
  namespace: eclipse-che
  labels:
    app.kubernetes.io/part-of: che.eclipse.org
    app.kubernetes.io/component: oauth-scm-configuration
  annotations:
    che.eclipse.org/oauth-scm-server: forgejo
    che.eclipse.org/scm-server-endpoint: https://git.weebo.poc # adjust to the Forgejo URL
type: Opaque
stringData:
  id: <client-id>
  secret: <client-secret>
