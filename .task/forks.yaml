version: '3'

vars:
  ORG: weebo-si # override: task forks ORG=other-org
  BRANCH: feat/forgejo-gitservice
  PUSH: '{{.PUSH | default "false"}}'
  SIGN: '{{.SIGN | default ""}}'
  REPOS:
    sh: yq -r '.forks | keys | join(" ")' forks.yaml
  # Forks whose develop merges {{.BRANCH}}: the only ones that get the branch
  BRANCH_REPOS:
    sh: yq -r '[.forks | to_entries[] | select((.value.develop.merge // []) | map(.branch // .) | contains(["{{.BRANCH}}"])) | .key] | join(" ")' forks.yaml
  # Upstream org of a fork, as in forks.yaml (upstreamOrg, default from defaults)
  UPSTREAM_OF: upstream_of() { yq -r ".forks[\"$1\"].upstreamOrg // .defaults.upstreamOrg" forks.yaml; }

tasks:
  default:
    desc: "Create forks, feature branches and print the status"
    cmds:
      - task: check
      - task: create
      - task: branch
      - task: status

  check:
    desc: "Check gh auth and access to the organization"
    preconditions:
      - sh: command -v gh >/dev/null 2>&1
        msg: "gh is missing: run `mise use -g gh`"
      - sh: gh auth status >/dev/null 2>&1
        msg: "Not logged in: run `gh auth login` (scopes: repo, read:org)"
      - sh: gh api orgs/{{.ORG}} >/dev/null 2>&1
        msg: "Organization {{.ORG}} not found or not accessible"

  create:
    desc: "Fork upstream repositories into the organization (idempotent)"
    deps: [check]
    cmds:
      - |
        {{.UPSTREAM_OF}}
        for repo in {{.REPOS}}; do
          if gh api "repos/{{.ORG}}/$repo" >/dev/null 2>&1; then
            echo "✔ {{.ORG}}/$repo already exists"
          else
            gh repo fork "$(upstream_of "$repo")/$repo" --org "{{.ORG}}" --clone=false --default-branch-only
            echo "✚ {{.ORG}}/$repo forked"
          fi
        done

  branch:
    desc: "Create {{.BRANCH}} from the default branch on each fork that merges it in forks.yaml (idempotent)"
    deps: [check]
    cmds:
      - |
        for repo in {{.BRANCH_REPOS}}; do
          # A fresh fork can take a few seconds to be ready
          for i in 1 2 3 4 5; do gh api "repos/{{.ORG}}/$repo" >/dev/null 2>&1 && break; sleep 3; done
          if gh api "repos/{{.ORG}}/$repo/branches/{{.BRANCH}}" >/dev/null 2>&1; then
            echo "✔ {{.ORG}}/$repo:{{.BRANCH}} already exists"
            continue
          fi
          default=$(gh api "repos/{{.ORG}}/$repo" --jq .default_branch)
          sha=$(gh api "repos/{{.ORG}}/$repo/git/ref/heads/$default" --jq .object.sha)
          gh api "repos/{{.ORG}}/$repo/git/refs" -f ref="refs/heads/{{.BRANCH}}" -f sha="$sha" >/dev/null
          echo "✚ {{.ORG}}/$repo:{{.BRANCH}} created from $default@${sha:0:7}"
        done

  sync:
    desc: "Fast-forward fork branches to upstream, as listed in forks.yaml (PUSH=true to push)"
    deps: [check]
    cmds:
      - PUSH={{.PUSH}} SIGN={{.SIGN}} scripts/fork-sync.sh sync {{.CLI_ARGS}}

  develop:
    desc: "Merge the branches listed in forks.yaml into each develop branch (PUSH=true to push)"
    deps: [check]
    cmds:
      - PUSH={{.PUSH}} SIGN={{.SIGN}} scripts/fork-sync.sh develop {{.CLI_ARGS}}

  update:
    desc: "Sync, fetch outside branches and update develop, as in forks.yaml (PUSH=true to push)"
    deps: [check]
    cmds:
      - PUSH={{.PUSH}} SIGN={{.SIGN}} scripts/fork-sync.sh update {{.CLI_ARGS}}

  plan:
    desc: "Show what `update` would do, without pushing"
    deps: [check]
    cmds:
      - SIGN={{.SIGN}} scripts/fork-sync.sh status {{.CLI_ARGS}}

  status:
    desc: "Show fork and branch status"
    deps: [check]
    cmds:
      - |
        {{.UPSTREAM_OF}}
        for repo in {{.REPOS}}; do
          default=$(gh api "repos/{{.ORG}}/$repo" --jq .default_branch 2>/dev/null) || { echo "✘ {{.ORG}}/$repo missing"; continue; }
          behind=$(gh api "repos/{{.ORG}}/$repo/compare/$(upstream_of "$repo"):$default...$default" --jq .behind_by 2>/dev/null || echo "?")
          has_branch=$(gh api "repos/{{.ORG}}/$repo/branches/{{.BRANCH}}" >/dev/null 2>&1 && echo yes || echo no)
          printf '%-16s default=%-6s behind_upstream=%-4s %s=%s\n' "$repo" "$default" "$behind" "{{.BRANCH}}" "$has_branch"
        done